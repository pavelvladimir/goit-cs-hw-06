<!DOCTYPE html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Надіслати повідомлення — GoIT</title>
    <link rel="stylesheet" href="/vendor/bootstrap.min.css" />
    <link rel="stylesheet" href="/style.css" />
  </head>
  <body>
    <header>
      <nav
        class="navbar navbar-expand navbar-dark bg-dark"
        aria-label="Головна навігація"
      >
        <div class="container-fluid">
          <a class="navbar-brand" href="/" aria-label="На головну">
            <img src="/logo.png" alt="GoIT" width="100" height="30" />
          </a>
          <div class="collapse navbar-collapse" id="navbarsExample02">
            <ul class="navbar-nav me-auto">
              <li class="nav-item">
                <a class="nav-link" href="/">Головна</a>
              </li>
              <li class="nav-item">
                <a class="nav-link active" aria-current="page" href="/message.html">Надіслати повідомлення</a>
              </li>
            </ul>
          </div>
        </div>
      </nav>
    </header>
    <div class="container mt-3">
      <main class="form-signin m-auto">
        <p class="notice" role="status">{{NOTICE}}</p>
        <form action="/message" method="POST">
          <h1 class="h3 mb-3 fw-normal">Надіслати повідомлення</h1>

          <div class="row mb-3">
            <label for="floatingInput">Ваше ім’я</label>
            <input type="text" class="form-control" id="floatingInput" name="username" value="{{USERNAME}}" required maxlength="80" autocomplete="nickname"/>
          </div>

          <div class="row mb-3 h-100">
            <label for="floatingTextarea">Повідомлення</label>
            <textarea class="form-control" id="floatingTextarea" name="message" required maxlength="4000" rows="8">{{MESSAGE}}</textarea>
          </div>

          <button class="w-100 btn btn-lg btn-primary" type="submit">
            Надіслати
          </button>
        </form>
      </main>
    </div>
  </body>
</html>
